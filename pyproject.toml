[project]
name = "master-thesis-nabodita"
version = "0.1.0"
description = ""
authors = [
    {name = "Nabodita Anam Nova",email = "naboditaanam.nova@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "typer (>=0.20.0,<0.21.0)",
    "alembic (>=1.17.0,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "certifi (>=2025.10.5,<2026.0.0)",
    "mariadb (>=1.1.14,<2.0.0)",
    "plotly (>=6.4.0,<7.0.0)",
    "kaleido (>=1.2.0,<2.0.0)"
]

[project.scripts]
mfa-ingest = "mfa_ingest.cli:app"

[tool.poetry]
packages = [{ include = "mfa_ingest" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "ruff (>=0.14.1,<0.15.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "jupyterlab (>=4.4.9,<5.0.0)",
    "ipykernel (>=7.0.1,<8.0.0)"
]
